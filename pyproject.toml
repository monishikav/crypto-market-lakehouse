[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-market-lakehouse"
version = "0.1.0"
description = "Batch + streaming crypto market data lakehouse (Binance/CoinGecko -> S3/Delta -> dbt)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
