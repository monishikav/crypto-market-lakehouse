# Local stack. Start what you need, when you need it (saves laptop RAM):
#   docker compose build                         # once (~10 min first time)
#   docker compose run --rm spark python scripts/check_spark.py   # Spark + Delta smoke test
#   docker compose up -d kafka                   # Phase 6
#   docker compose up -d airflow                 # Phase 5 -> http://localhost:8090
#   docker compose down                          # stop everything

x-env: &common-env
  PYTHONPATH: /opt/project/src
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092   # containers talk to Kafka on the internal listener
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}

x-lakehouse: &lakehouse
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: crypto-lakehouse:0.1
  env_file:
    - path: .env
      required: false
  volumes:
    - ./:/opt/project          # your repo, live-mounted: edit on Windows, run in Linux
  working_dir: /opt/project

services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"            # for producers running on Windows (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller      # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Ad-hoc Spark jobs:  docker compose run --rm --service-ports spark python -m <module>
  spark:
    <<: *lakehouse
    profiles: ["tools"]        # never started by `up`, only by `run`
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["python", "scripts/check_spark.py"]
    environment:
      <<: *common-env
    ports:
      - "4040:4040"            # Spark UI while a job runs

  airflow:
    <<: *lakehouse
    container_name: lakehouse-airflow
    command: standalone        # api-server + scheduler + dag-processor + triggerer, SQLite
    ports:
      # 8080 is often taken on Windows; override with AIRFLOW_PORT in .env if 8090 is too.
      - "${AIRFLOW_PORT:-8090}:8080"
    environment:
      <<: *common-env
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local only: no login screen
    volumes:
      - ./:/opt/project
      - airflow-home:/opt/airflow

volumes:
  airflow-home:
